name: Build flip-phone APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (installable, auto-signed with the debug key)
        run: |
          set +e
          ./gradlew assembleFossDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -nE "^e: |error:|FAILED|What went wrong|Execution failed|Could not|requires|minSdk|AAPT|Manifest merger|Caused by" -A2 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=GradleErrors::$msg"
            tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}' > tail.txt
            echo "::error title=GradleTail::$(cat tail.txt)"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: flip-messages-apk
          path: app/build/outputs/apk/foss/debug/*.apk
      - name: Publish APK as a GitHub Release (downloadable straight on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/foss/debug/*.apk flip-messages.apk
          gh release create "flip-${{ github.run_number }}" flip-messages.apk \
            --title "Flip Messages build ${{ github.run_number }}" \
            --notes "Debug-signed APK for Android 7 flip phones. Download flip-messages.apk, install it, and set it as the default SMS app."
