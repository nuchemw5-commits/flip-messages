name: Build flip-phone APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (installable, auto-signed with the debug key)
        run: ./gradlew assembleFossDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: flip-messages-apk
          path: app/build/outputs/apk/foss/debug/*.apk
